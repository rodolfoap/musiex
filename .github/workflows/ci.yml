name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  abc:
    # Cross-checks the generated scores with an independent ABC parser.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save abcjs@6.4.4
      - name: Generate exercises in many meters, keys and levels
        run: |
          cargo build --release -p musiex-cli
          mkdir -p out
          i=0
          for m in 2/4 3/4 4/4 5/4 3/8 6/8 7/8 9/8 12/8 2/2; do
            for l in 1 2 3 4; do
              for k in C G Bb F#m Eb; do
                i=$((i+1))
                ./target/release/musiex generate -n 40 -o out/e$i --abc-only \
                  -m $m -l $l -k $k --rests --triplets --dotted --ties --sharps --flats -s $i
              done
            done
          done
          for ins in bb eb f tenor-sax guitar; do
            ./target/release/musiex generate -n 40 -o out/i-$ins --abc-only -i $ins -k F -l 3 -s 7
          done
      - run: node tools/check-abc.js out/*.abc crates/musiex-core/tests/golden/*.abc

  web:
    # Builds the practice screen and plays it in headless Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: ./web/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Smoke-test the practice screen
        run: |
          python3 -m http.server -d web 8000 &
          sleep 1
          node tools/web-smoke.js http://localhost:8000/

  video:
    # Renders a short exercise to MP4 with the real ffmpeg.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Render and inspect a video
        run: |
          cargo run --release -p musiex-cli -- video -n 4 -t 120 --size 640x360 -s 7 -o out.mp4
          ffprobe -v error -show_entries stream=codec_name,width,height -of csv=p=0 out.mp4 | tee streams.txt
          grep -qx 'h264,640,360' streams.txt
          grep -qx 'aac' streams.txt
          # One count-in bar and four bars of 4/4 at 120 bpm, plus a one-second tail.
          d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4)
          awk -v d="$d" 'BEGIN { exit !(d > 10.8 && d < 11.3) }'
