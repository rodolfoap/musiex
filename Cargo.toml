[workspace]
resolver = "2"
members = ["crates/musiex-core", "crates/musiex-audio", "crates/musiex-engrave", "crates/musiex-web", "crates/musiex-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/rodolfoap/musiex"

[profile.release]
lto = true
opt-level = 3
