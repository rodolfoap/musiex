[package]
name = "musiex-web"
description = "The musiex practice screen's WebAssembly core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
musiex-core = { path = "../musiex-core" }
musiex-audio = { path = "../musiex-audio" }
musiex-engrave = { path = "../musiex-engrave" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
